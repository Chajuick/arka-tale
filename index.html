<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>아르카 테일 — 이야기 서재</title>
    <meta name="description" content="코브와 인간, 그리고 세 번의 기회에 관한 이야기. 책장에서 책을 꺼내 한 장씩 넘겨 읽는 아르카 테일의 이야기 서재." />
    <meta name="keywords" content="아르카 테일, Arka Tale, 동화, 판타지, 세계관, 이야기, 코브, 조율사, 길잡이" />
    <meta name="author" content="Arka Tale" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a1210" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- 아이콘 / 앱 정보 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="아르카 테일" />
    <meta name="apple-mobile-web-app-title" content="아르카 테일" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- 링크 공유 미리보기 (OG / 트위터) — %SITE_URL%은 빌드 시 배포 주소로 채워짐 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="아르카 테일" />
    <meta property="og:title" content="아르카 테일 — 이야기 서재" />
    <meta property="og:description" content="코브와 인간, 그리고 세 번의 기회에 관한 이야기. 책장에서 책을 꺼내 읽어보세요." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="아르카 테일 이야기 서재 — 책이 꽂힌 나무 책장" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="아르카 테일 — 이야기 서재" />
    <meta name="twitter:description" content="코브와 인간, 그리고 세 번의 기회에 관한 이야기." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="아르카 테일 이야기 서재 — 책이 꽂힌 나무 책장" />

    <!-- 검색엔진용 구조화 데이터 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "아르카 테일",
        "alternateName": "Arka Tale",
        "description": "코브와 인간, 그리고 세 번의 기회에 관한 이야기. 책장에서 책을 꺼내 읽는 이야기 서재.",
        "inLanguage": "ko",
        "url": "%SITE_URL%/"
      }
    </script>
  </head>
  <body class="in-intro">
    <canvas id="shelf"></canvas>

    <header id="hint">
      <p><span class="for-mouse">책을 눌러 꺼내 읽어보세요 · 휠, 드래그, 화살표로 위아래 책장 보기</span><span class="for-touch">책을 눌러 꺼내 읽어보세요 · 위아래로 밀어 책장 보기</span></p>
    </header>

    <nav id="cases" class="hidden" aria-label="책장 목록"></nav>
    <button id="edge-up" class="edge hidden" aria-label="위 책장">▲ 위 책장</button>
    <button id="edge-down" class="edge hidden" aria-label="아래 책장">▼ 아래 책장</button>

    <div id="tip" class="hidden"></div>
    <div id="toast"></div>

    <div id="reader" class="hidden">
      <div class="stage">
        <div class="book"></div>
      </div>
      <button class="close" aria-label="닫기">책 덮기 ✕</button>
      <div class="nav">
        <button class="nav-prev" aria-label="이전 쪽">◀</button>
        <span class="progress"></span>
        <button class="nav-next" aria-label="다음 쪽">▶</button>
      </div>
    </div>

    <!-- 인트로 -->
    <div id="intro" role="dialog" aria-label="아르카 테일">
      <div class="intro-glow"></div>
      <div class="intro-motes"></div>
      <div class="intro-inner">
        <img class="intro-emblem" src="/emblem.svg" width="128" height="128" alt="" />
        <div class="intro-kicker">이야기 서재</div>
        <h1 class="intro-title" aria-label="아르카 테일"></h1>
        <p class="intro-sub">코브와 인간, 그리고 세 번의 기회에 관한 이야기</p>
        <button class="intro-enter" disabled>책장을 준비하는 중…</button>
      </div>
    </div>

    <!-- OG 이미지 촬영용 (/?og) -->
    <div id="og-card" class="hidden">
      <img src="/emblem.svg" width="112" height="112" alt="" />
      <div class="og-kicker">이야기 서재</div>
      <div class="og-title">아르카 테일</div>
      <div class="og-line"></div>
      <div class="og-sub">코브와 인간, 그리고<br />세 번의 기회에 관한 이야기</div>
      <div class="og-badge">책장에서 책을 꺼내 읽어보세요</div>
    </div>

    <noscript><p style="color:#f4e6c8;text-align:center;margin-top:40vh">이 서재는 자바스크립트가 필요해요.</p></noscript>

    <!-- 쪽 나누기 측정용 (화면 밖) -->
    <div id="measure" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
